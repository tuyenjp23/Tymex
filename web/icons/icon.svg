<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Tymex">
  <!-- Biểu tượng Tymex: quả bóng vàng trên nền xanh navy đậm (màu thương hiệu ink/amber).
       Quả bóng nằm gọn trong vùng giữa để dùng được cả khi hệ điều hành cắt theo mặt nạ. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2a47"/>
      <stop offset="1" stop-color="#0e1626"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="url(#bg)" stroke="#2a3a58" stroke-width="2"/>
  <circle cx="256" cy="256" r="170" fill="#f4b942"/>
  <g stroke="#0e1626" stroke-width="15" stroke-linecap="round">
    <line x1="256.0" y1="198.0" x2="256.0" y2="86.0"/>
    <line x1="311.2" y1="238.1" x2="417.7" y2="203.5"/>
    <line x1="290.1" y1="302.9" x2="355.9" y2="393.5"/>
    <line x1="221.9" y1="302.9" x2="156.1" y2="393.5"/>
    <line x1="200.8" y1="238.1" x2="94.3" y2="203.5"/>
  </g>
  <polygon points="256.0,198.0 311.2,238.1 290.1,302.9 221.9,302.9 200.8,238.1" fill="#0e1626"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="#0e1626" stroke-width="9"/>
</svg>
