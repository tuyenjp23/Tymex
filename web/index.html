<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1626">
  <meta name="robots" content="noindex, nofollow">
  <title>Tymex — Phân tích & dự đoán bóng đá</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tymex">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/styles.css?v=20261026f">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">Tymex — Phân tích & dự đoán bóng đá</a>
    <nav class="nav" id="nav" aria-label="Điều hướng chính">
      <a href="#/" data-route="dashboard">Tổng quan</a>
      <a href="#/live" data-route="live">Trực tiếp</a>
      <a href="#/schedule" data-route="schedule">Lịch thi đấu</a>
      <a href="#/standings" data-route="standings">Bảng xếp hạng</a>
      <a href="#/outrights" data-route="outrights">Vô địch</a>
      <a href="#/teams" data-route="teams">Đội bóng</a>
      <a href="#/predictions" data-route="predictions">Lịch sử dự đoán</a>
      <a href="#/settings" data-route="settings">Cài đặt</a>
    </nav>
    <div class="tools">
      <label class="tz" title="Múi giờ hiển thị">
        <span class="sr">Múi giờ</span>
        <select id="tz-select"></select>
      </label>
      <button class="btn btn-accent" id="sync-btn" type="button">Làm mới</button>
    </div>
  </header>

  <div id="banners"></div>
  <main id="app" tabindex="-1"><p class="muted pad">Đang tải…</p></main>
  <div id="toasts" role="status" aria-live="polite"></div>

  <noscript><p class="pad">Trang này cần bật JavaScript để hoạt động.</p></noscript>
  <script>
    /* Chẩn đoán: nếu sau 8 giây ứng dụng chưa khởi động, hiện nguyên nhân thay vì "Đang tải…" mãi. */
    (function () {
      var errs = [];
      window.addEventListener("error", function (e) { errs.push((e.filename || "").split("/").pop().split("?")[0] + ":" + (e.lineno || "?") + " " + (e.message || "lỗi script")); });
      setTimeout(function () {
        if (window.__tymexStarted) return;
        var el = document.getElementById("app");
        var why = errs.length ? errs.join(" | ") : (window.supabase ? "không có lỗi script nhưng app.js chưa chạy" : "không tải được thư viện Supabase (cdn.jsdelivr.net bị chặn hoặc mạng lỗi)");
        el.innerHTML = '<div class="notice error"><b>Ứng dụng chưa khởi động được.</b><br>' + why.replace(/</g, "&lt;") + '<br>Thử Ctrl+F5, hoặc mở bằng cửa sổ ẩn danh.</div>';
      }, 8000);
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="/config.js?v=20261026f"></script>
  <script src="/data.js?v=20261026f"></script>
  <script src="/live.js?v=20261026f"></script>
  <script src="/app.js?v=20261026f"></script>
  <script>
    /* PWA: đăng ký service worker (đệm vỏ ứng dụng để mở nhanh/ngoại tuyến).
       Mọi lỗi đều bỏ qua lặng lẽ — trang hoạt động y hệt khi không có service worker. */
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/sw.js").catch(function () { /* bỏ qua */ });
      });
    }
  </script>
</body>
</html>
